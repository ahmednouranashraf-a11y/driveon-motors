<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRIVEON MOTORS - معرض السيارات</title>
    <!-- Tailwind CSS لتنسيق المظهر بسهولة -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen">

    <!-- Navbar / الهيدر -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-extrabold text-blue-400 cursor-pointer" onclick="showSection('home')">DRIVEON MOTORS</h1>
            <nav class="space-x-6 space-x-reverse">
                <button onclick="showSection('home')" class="hover:text-blue-400 font-semibold px-2 py-1">الرئيسية</button>
                <button onclick="showSection('inventory')" class="hover:text-blue-400 font-semibold px-2 py-1">المعرض</button>
                <button onclick="showSection('favorites')" class="hover:text-blue-400 font-semibold px-2 py-1">المفضلة ❤️</button>
            </nav>
        </div>
    </header>

    <!-- 1. قسم الصفحة الرئيسية (Home Section) -->
    <main id="home-section" class="p-6">
        <!-- Hero Banner -->
        <div class="text-center py-16 bg-gradient-to-r from-blue-900 to-slate-900 rounded-2xl mb-12 border border-slate-700">
            <h1 class="text-5xl font-extrabold mb-4 text-blue-400">DRIVEON MOTORS</h1>
            <p class="text-xl text-gray-300 mb-6">أحلامك على الطريق بتبدأ من هنا - أفضل الأسعار والمواصفات</p>
            <button onclick="showSection('inventory')" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-lg text-lg transition">تصفح المعرض الآن</button>
        </div>

        <!-- Quick Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-5xl mx-auto text-center mb-12">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h3 class="text-3xl font-bold text-blue-400 mb-2">+100</h3>
                <p class="text-gray-400">سيارة متوفرة في المعرض</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h3 class="text-3xl font-bold text-blue-400 mb-2">100%</h3>
                <p class="text-gray-400">فحص وصيانة مضمونة</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h3 class="text-3xl font-bold text-blue-400 mb-2">24/7</h3>
                <p class="text-gray-400">خدمة عملاء ودعم استشاري</p>
            </div>
        </div>
    </main>

    <!-- 2. قسم معرض السيارات (Inventory Section) -->
    <main id="inventory-section" class="p-6 hidden max-w-7xl mx-auto">
        <h2 class="text-3xl font-bold mb-6 text-blue-400 border-b border-slate-700 pb-3">جميع السيارات المتاحة</h2>
        
        <!-- حقل البحث والتصفية -->
        <div class="mb-8">
            <input type="text" id="searchInput" oninput="filterCars()" placeholder="ابحث باسم السيارة أو الماركة..." class="w-full md:w-1/2 p-3 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-blue-500">
        </div>

        <!-- قائمة السيارات -->
        <div id="carsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- سيتم توليد الكروت هنا بواسطة JavaScript -->
        </div>
    </main>

    <!-- 3. قسم المفضلة (Favorites Section) -->
    <main id="favorites-section" class="p-6 hidden max-w-7xl mx-auto">
        <h2 class="text-3xl font-bold mb-6 text-blue-400 border-b border-slate-700 pb-3">السيارات المفضلة ❤️</h2>
        <div id="favoritesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- سيتم توليد سيارات المفضلة هنا -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
